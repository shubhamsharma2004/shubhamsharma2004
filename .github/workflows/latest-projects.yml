name: Update latest projects

on:
  schedule:
    - cron: "30 0 * * *"   # every day at 00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/latest-projects.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build latest projects table
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const { data } = await github.rest.repos.listForUser({ username: owner, sort: 'pushed', per_page: 50 });
            const repos = data.filter(r => !r.fork && !r.archived && r.name !== owner).slice(0, 5);
            const rows = repos.map(r => {
              const desc = (r.description || '').replace(/\|/g, '-');
              const date = new Date(r.pushed_at).toISOString().slice(0, 10);
              const demo = r.homepage ? ` · [Live](${r.homepage})` : '';
              return `| [${r.name}](${r.html_url})${demo} | ${desc} | ${r.language || '-'} | ${date} |`;
            });
            const table = ['| Project | Description | Language | Last Updated |', '|---|---|---|---|', ...rows].join('\n');
            const md = fs.readFileSync('README.md', 'utf8');
            const re = /(<!-- LATEST_PROJECTS:START -->)[\s\S]*?(<!-- LATEST_PROJECTS:END -->)/;
            fs.writeFileSync('README.md', md.replace(re, `$1\n${table}\n$2`));

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update latest projects" && git push)
